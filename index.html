<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mega Geek 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mega Geek 2026</h1>
        <p>O maior encontro de cultura pop, tecnologia e games da região</p>
    </header>

    <main>
        <section class="card">
            <h2>Atividades do evento</h2>
            <ul>
                <li>Torneios de jogos</li>
                <li>Concurso de cosplay</li>
                <li>Palestras com especialistas</li>
            </ul>
        </section>

        <section class="card">
            <h2>Inscrição</h2>
            <form id="formInscricao">
                <input type="text" id="nome" placeholder="Seu nome completo" required>
                <input type="email" id="email" placeholder="Seu e-mail" required>
                <button type="submit">Inscrever-se</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
